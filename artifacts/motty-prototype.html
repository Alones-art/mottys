<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motty · 可交互 UI 原型（按现有代码还原）</title>
<style>
:root{--shell:#E7E7EB;--workspace:#F0F0F3;--surface:#F8F8FA;--soft:#EBEBEF;--hot:#DDDDE2;--line:#DCDCE1;--stroke:#CCCCD2;--text:#26262A;--muted:#5E5E64;--faint:#86868C;--success:#159147;--warning:#965A04;--danger:#D62828;--brand:#03A487;--rc:7.5px;--rs:11px;--ch:32px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--workspace);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;flex-direction:column;height:100vh}
.titlebar{height:36px;flex:none;background:var(--shell);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:12px;color:var(--muted)}
.titlebar .tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden}
.tt{display:flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:6px;background:#EEEEF1;color:var(--muted);white-space:nowrap;font-size:11.5px;cursor:default}
.tt.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.tt .d{width:6px;height:6px;border-radius:50%;background:var(--success)}
.tt .x{color:var(--faint);margin-left:2px}
.win{display:flex;gap:14px;color:var(--faint);letter-spacing:2px}
.frame{display:flex;flex:1;min-height:0}
.sidebar{width:204px;flex:none;background:var(--shell);border-right:1px solid var(--line);padding:14px 9px 10px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 18px}
.brand svg{width:30px;height:30px}
.brand b{font-size:17px;font-weight:650;letter-spacing:-.03em}
.nav{display:flex;flex-direction:column;gap:4px}
.ni{height:36px;display:flex;align-items:center;gap:12px;padding:0 15px;border-radius:var(--rc);font-size:14px;font-weight:500;color:#55555C;cursor:default;position:relative;user-select:none}
.ni:hover{background:var(--soft)}
.ni.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ni.on::before{content:"";position:absolute;left:-9px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.ni.on svg.i{color:var(--brand)}
.ni svg.i{color:#7C7C84;width:16px;height:16px}
.side-gap{height:14px}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--workspace);overflow:hidden}
.page{flex:1;min-height:0;overflow:auto;padding:18px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.ph h1{font-size:18px;font-weight:600;margin:0 0 4px;line-height:28px}
.ph p{font-size:12px;color:var(--muted);margin:0}
.row{display:flex;align-items:center;gap:10px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{height:var(--ch);display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:var(--rc);border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;cursor:default;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--soft)}
.btn svg.i{width:14px;height:14px}
.btn.p{background:var(--text);color:#F8F8FA;border-color:var(--text)}
.btn.p:hover{opacity:.88;background:var(--text)}
.btn.d{color:var(--danger)}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.iconbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;border:1px solid transparent;color:var(--muted);cursor:default}
.iconbtn:hover{background:var(--soft)}
.iconbtn.on{background:var(--surface);border-color:var(--line);color:var(--text)}
.iconbtn svg.i{width:14px;height:14px}
.search{display:flex;align-items:center;gap:8px;height:var(--ch);width:min(41vw,485px);min-width:220px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rc);background:var(--surface)}
.search:focus-within{border-color:var(--brand)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:12.5px}
.search input::placeholder{color:var(--faint)}
.search svg.i{width:14px;height:14px;color:var(--faint)}
.kbd{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:#FBFBFC}
.spacer{flex:1}
.chips{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.chk{width:14px;height:14px;border:1.5px solid #C3C3CA;border-radius:4px;flex:none;cursor:default;display:grid;place-items:center}
.chk.on{background:var(--text);border-color:var(--text);color:#fff;font-size:10px;line-height:1}
.chk.half{background:var(--text);border-color:var(--text);position:relative}
.chk.half::after{content:"";width:7px;height:1.5px;background:#fff;position:absolute}
.allchk{margin-right:8px}
.chip{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);cursor:default;white-space:nowrap}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--text);border-color:var(--text);color:#F8F8FA;font-weight:600}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.7}
.chip svg.i{width:12px;height:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.grow{height:42px;display:flex;align-items:center;gap:11px;padding:0 14px;cursor:default;user-select:none}
.grow:hover{background:var(--soft)}
.grow .chev{transition:transform .15s;color:var(--faint)}
.grow.open .chev{transform:rotate(90deg)}
.gname{font-weight:600;font-size:13px}
.gcount{font-family:var(--mono);font-size:11px;color:var(--faint)}
.star{color:var(--warning);font-size:12px}
.hrow{height:64px;display:flex;align-items:center;gap:12px;padding:0 14px 0 42px;cursor:default;border-top:1px solid var(--line);user-select:none}
.hrow:hover{background:var(--soft)}
.hrow.sel{background:#E6F3EF}
.badge{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;letter-spacing:-.03em}
.hname{font-size:13px;font-weight:600;line-height:1.3}
.hsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.haddr{font-size:11.5px;color:var(--muted);font-family:var(--mono);width:170px;flex:none}
.tags{display:flex;gap:5px;flex:1;min-width:0;overflow:hidden}
.tag{font-size:10.5px;padding:2px 7px;border-radius:10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.state{display:flex;align-items:center;gap:6px;font-size:11.5px;width:86px;flex:none;justify-content:flex-end}
.sdot{width:7px;height:7px;border-radius:50%;background:#B9B9C0}
.sdot.on{background:var(--success)}
.sdot.fail{background:var(--danger)}
.sdot.wait{background:var(--warning)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.hcard{height:64px;display:flex;align-items:center;gap:11px;padding:0 12px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;cursor:default}
.hcard:hover{background:var(--soft)}
.hcard.sel{border-color:var(--brand);background:#E6F3EF}
.hcard .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.selbar{display:flex;align-items:center;gap:6px;padding:7px 10px;margin-bottom:10px;border-radius:var(--rc);background:var(--surface);border:1px solid var(--line);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.tbl th{height:34px;text-align:left;padding:0 12px;font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--faint);text-transform:uppercase;border-bottom:1px solid var(--line);background:#FBFBFC}
.tbl td{height:40px;padding:0 12px;border-bottom:1px solid #ECECEF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr{cursor:default}
.tbl tbody tr:hover{background:var(--soft)}
.tbl tbody tr.on{background:#E6F3EF}
.mono{font-family:var(--mono);font-size:11.5px}
.pill{font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--muted)}
.pill.ok{background:#E4F3E9;color:var(--success)}
.pill.warn{background:#F6EBD8;color:var(--warning)}
.empty{padding:48px 20px;text-align:center;color:var(--faint);font-size:13px}
.term{flex:1;display:flex;flex-direction:column;min-height:0}
.termbar{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--shell);border-bottom:1px solid var(--line)}
.termbody{flex:1;display:flex;min-height:0}
.terminal{flex:1;min-width:0;background:#11151B;color:#E2E7EE;font-family:var(--mono);font-size:12.5px;line-height:1.75;padding:14px 18px;overflow:auto}
.terminal .g{color:#62CE88}
.terminal .b{color:#85B7EB}
.terminal .m{color:#9EABB8}
.terminal .cur{display:inline-block;width:7px;height:14px;background:#62CE88;vertical-align:-2px}
.sftp{width:46%;min-width:320px;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
.sftpbar{height:34px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line)}
.sftppath{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:var(--mono);font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.crumb{cursor:default;color:var(--text)}
.crumb:hover{text-decoration:underline}
.flist{flex:1;overflow:auto}
.frow{height:30px;display:flex;align-items:center;gap:9px;padding:0 12px;font-size:12px;border-bottom:1px solid #F0F0F2;cursor:default;user-select:none}
.frow:hover{background:var(--soft)}
.frow.on{background:#E6F3EF}
.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fs{width:80px;text-align:right;color:var(--muted);font-family:var(--mono);font-size:11px}
.frow .fm{width:120px;text-align:right;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.fhead{height:28px;display:flex;align-items:center;padding:0 12px;gap:9px;font-size:10.5px;color:var(--faint);border-bottom:1px solid var(--line);background:#FBFBFC}
.fhead .fn{flex:1}
.fhead .fs{width:80px;text-align:right}
.fhead .fm{width:120px;text-align:right}
.settings{display:flex;gap:16px;min-height:0}
.setnav{width:200px;flex:none;display:flex;flex-direction:column;gap:4px}
.setrow{height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--rc);font-size:13px;cursor:default;color:var(--muted)}
.setrow:hover{background:var(--soft)}
.setrow.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.setbody{flex:1;min-width:0}
.opt{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);font-size:13px}
.opt .lbl{width:180px;flex:none}
.opt .desc{font-size:11px;color:var(--faint);margin-left:auto}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--rc);padding:2px;gap:2px}
.seg span{padding:5px 11px;border-radius:5px;font-size:11.5px;cursor:default;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sw{width:34px;height:20px;border-radius:12px;background:#C9C9CF;position:relative;cursor:default;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--success)}
.sw.on::after{left:16px}
.notes{display:flex;gap:12px;height:100%}
.notetree{width:230px;flex:none;display:flex;flex-direction:column;gap:2px}
.notetree .t{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px;font-size:12.5px;cursor:default}
.notetree .t:hover{background:var(--soft)}
.notetree .t.on{background:#E6F3EF;color:var(--success)}
.editor{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:16px 20px;font-size:13px;line-height:1.8;overflow:auto}
.editor h2{font-size:18px;margin:0 0 12px}
.overlay{position:absolute;inset:0;background:rgba(20,22,26,.32);display:flex;align-items:center;justify-content:center;z-index:60}
.dlg{width:560px;max-width:calc(100vw - 40px);max-height:82vh;overflow:auto;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--rs);box-shadow:0 18px 50px rgba(0,0,0,.22)}
.dlg.wide{width:680px}
.dlg h3{font-size:15px;font-weight:600;margin:0;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg .body{padding:16px 20px}
.dlg .foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rc);background:#fff;outline:0;font-size:12.5px}
.field input:focus,.field select:focus{border-color:var(--brand)}
.hint{font-size:11px;color:var(--faint);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 84px;gap:10px}
.ctx{position:absolute;z-index:70;min-width:190px;background:var(--surface);border:1px solid var(--stroke);border-radius:10px;padding:5px;box-shadow:0 10px 28px rgba(0,0,0,.16);font-size:12.5px}
.ctx .ci{height:30px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:6px;cursor:default;white-space:nowrap}
.ctx .ci:hover{background:var(--soft)}
.ctx .ci.d{color:var(--danger)}
.ctx .ci.d:hover{background:#FBE9E9}
.ctx .sep{height:1px;background:var(--line);margin:4px 6px}
.ctx .ci svg.i{width:14px;height:14px;color:var(--faint)}
.notice{position:absolute;right:16px;bottom:16px;z-index:80;background:var(--text);color:#F8F8FA;padding:10px 14px;border-radius:8px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media(max-width:1000px){.split{grid-template-columns:1fr}.sidebar{width:170px}.haddr,.tags{display:none}}
</style>
</head>

<symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 3v3h-3"/></symbol>
<symbol id="i-list" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h7"/></symbol>

<symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10M6.5 7v4M9.5 7v4"/></symbol>

}
function openMenu(x,y,items){S.menu={x,y,items};render()}
function hostMenu(x,y,id){const h=HOSTS.find(v=>v.id===id);openMenu(x,y,[{t:'连接',a:'connectOne',v:id,i:'plug'},{t:'文件传输',a:'openSftp',v:id,i:'folder'},null,{t:'复制连接地址和端口',a:'copyAddr',v:id,i:'copy'},{t:'复制连接名称',a:'copyName',v:id,i:'copy'},{t:'复制主机',a:'copyHost'},{t:'',a:'noop'}].filter(i=>!i||i.t).concat([null,{t:'编辑',a:'dialog',v:'newHost',i:'pencil'},{t:'移动分组',a:'groupMenu',v:h.g,i:'folder'},{t:'删除',a:'dialog',v:'deleteHost',i:'trash',d:true}]))}
function groupMenu(x,y,g){openMenu(x,y,[{t:'新建主机',a:'dialog',v:'newHost',i:'plus'},{t:'新建子分组',a:'dialog',v:'newFolder',i:'folderplus'},{t:'修改分组名称',a:'groupRename',v:g,i:'pencil'},{t:'移动整个分组',a:'noop',i:'folder'},null,{t:'置顶分组',a:'noop',i:'star'},{t:'上移',a:'noop'},{t:'下移',a:'noop'},null,{t:'删除分组',a:'noop',i:'trash',d:true}])}
function sftpMenu(x,y,idx){const f=idx!=null?FILES[idx]:null;const sel=S.fileSel.size>0;let items=[];if(f){items.push({t:'打开',a:'noop',i:'folder'});if(!f.d)items.push({t:'外部编辑',a:'noop',i:'pencil'});items.push(null);items.push({t:S.sftpLocal?'把路径输入终端':'下载',a:'noop',i:S.sftpLocal?'terminal':'download'});items.push({t:S.sftpLocal?'发送到服务器':'下载到此处',a:'noop',i:'download'});items.push(null,{t:'重命名',a:'noop',i:'pencil'},{t:'移动到…',a:'noop',i:'folder'},{t:'权限',a:'noop',i:'shield'},null,{t:'删除',a:'noop',i:'trash',d:true},null,{t:'复制完整路径',a:'noop',i:'copy'},{t:'文件属性',a:'fileProps',v:idx,i:'file'},null)}items=items.concat([{t:'新建文件夹',a:'dialog',v:'newFolderSftp',i:'folderplus'},{t:'新建文件',a:'dialog',v:'newFileSftp',i:'fileplus'}]);if(!S.sftpLocal)items=items.concat([{t:'上传',a:'sftpUpload',i:'up'},{t:'上传文件夹',a:'sftpUploadDir',i:'folderup'},{t:'新建符号链接',a:'noop',i:'link'}]);openMenu(x,y,items)}
function go(section){S.section=section;S.nav=section==='terminal'?'hosts':section;S.menu=null;S.modal=null;S.query='';S.importOpen=false;S.keyMenu=false;render()}
function openHost(h,trust){if(trust&&!S.trusted){S.hostKeyFor=h.n+' ('+h.a+')';S.pendingHost=h.id;S.modal='hostKey';render();return}S.trusted=true;S.tabs.push({name:h.n,user:h.u,addr:h.a});S.activeTab=S.tabs.length-1;S.sftp=false;go('terminal');notify('已连接 '+h.n)}
function handle(act,val,el,e){
 switch(act){
  case 'noop':notify('该操作在原型中为占位');break;
  case 'nav':go(val);break;
  case 'go':go(val);break;
  case 'filter':S.filter=val;S.menu=null;render();break;
  case 'moreChips':notify('更多分组：'+GROUPS.join(' / '));break;
  case 'selectAll':{const hs=HOSTS.filter(h=>(S.filter==='全部'||h.g===S.filter)&&(h.n+' '+h.u+'@'+h.a).toLowerCase().includes(S.query.toLowerCase()));const all=hs.length&&hs.every(h=>S.sel.has(h.id));S.sel=new Set(all?[]:hs.map(h=>h.id));render();break;}
  case 'hostCheck':{const id=+val;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render();break;}
  case 'groupCheck':{const gh=HOSTS.filter(h=>h.g===val);const all=gh.length&&gh.every(h=>S.sel.has(h.id));gh.forEach(h=>all?S.sel.delete(h.id):S.sel.add(h.id));render();break;}
  case 'hostClick':notify('双击可连接 · 右键打开菜单');break;
  case 'toggleGroup':S.expanded.has(val)?S.expanded.delete(val):S.expanded.add(val);render();break;
  case 'expandAll':S.expanded=new Set(GROUPS);render();break;
  case 'collapseAll':S.expanded=new Set();render();break;
  case 'view':S.view=val;render();break;
  case 'sortMenu':openMenu(e.clientX,e.clientY,[{t:'手动排序',a:'setSort',v:'手动排序'},{t:'按名称排序',a:'setSort',v:'按名称排序'},{t:'按 IP 地址排序',a:'setSort',v:'按 IP 地址排序'}]);break;
  case 'setSort':S.sort=val;S.menu=null;render();break;
  case 'newFolder':S.form={};S.modal='newFolder';render();break;
  case 'doNewGroup':{const n=S.form.gname||'新分组';if(!GROUPS.includes(n)){GROUPS.push(n);COLORS[n]='#2C6FE0';BADGE[n]='NG';HOSTS.push({id:Date.now(),n:'新主机',g:n,u:'root',a:'192.168.1.1',p:22,tags:[],st:'未连接',c:'#2C6FE0',sys:'ubuntu'})}S.modal=null;notify('已创建分组 '+n);render();break;}
  case 'dialog':S.detail=val==='moveGroup'?val:'';S.form={};S.testState='';S.modal=val;S.menu=null;S.importOpen=false;S.keyMenu=false;render();break;
  case 'closeModal':S.modal=null;S.testState='';render();break;
  case 'overlayClose':S.modal=null;S.testState='';render();break;
  case 'protocol':S.protocol=val;render();break;
  case 'testConn':S.testState='正在测试…';render();setTimeout(()=>{S.testState='连接成功 · 23 ms';render()},700);break;
  case 'saveHost':{const f=S.form;if(!f.label){S.testState='请填写名称';render();return}const g=GROUPS.includes(f.group)?f.group:'主机';HOSTS.push({id:Date.now(),n:f.label,g:g,u:f.user||'root',a:f.address||'192.168.1.1',p:+(f.port||22),tags:(f.tags||'').split(/[,， ]/).filter(Boolean),st:'未连接',c:COLORS[g]||'#2C6FE0',sys:'ubuntu'});S.modal=null;S.form={};notify('已添加主机 '+f.label);render();break;}
  case 'doDelete':{S.sel.forEach(id=>{const i=HOSTS.findIndex(h=>h.id===id);if(i>=0)HOSTS.splice(i,1)});const n=S.sel.size;S.sel=new Set();S.modal=null;notify('已删除 '+n+' 台主机');render();break;}
  case 'copyHost':{const h=HOSTS.find(x=>S.sel.has(x.id));if(h){HOSTS.push({...h,id:Date.now(),n:h.n+' 副本'});notify('已复制主机')}render();break;}
  case 'groupRename':S.detail=val;S.form={gname:val};S.modal='moveGroup';S.menu=null;render();break;
  case 'groupMenu':S.menu=null;groupMenu(e.clientX,e.clientY,val);break;
  case 'hostMenu':S.menu=null;hostMenu(e.clientX,e.clientY,+val);break;
  case 'copyAddr':{const h=HOSTS.find(x=>x.id===+val);S.menu=null;notify('已复制 '+h.a+':'+h.p);render();break;}
  case 'copyName':{const h=HOSTS.find(x=>x.id===+val);S.menu=null;notify('已复制 '+h.n);render();break;}
  case 'connect':{const id=[...S.sel][0];const h=HOSTS.find(x=>x.id===id)||HOSTS[0];if(h)openHost(h,true);break;}
  case 'connectOne':{const h=HOSTS.find(x=>x.id===+val);S.menu=null;if(h)openHost(h,true);break;}
  case 'trustHost':{const h=HOSTS.find(x=>x.id===S.pendingHost);S.trusted=true;S.modal=null;if(h)openHost(h,false);break;}
  case 'localTerminal':S.tabs.push({name:'本地终端',user:'dby',addr:'localhost'});S.activeTab=S.tabs.length-1;S.sftp=false;go('terminal');break;
  case 'openSftp':{const h=HOSTS.find(x=>x.id===+val);S.menu=null;if(h){S.tabs.push({name:h.n,user:h.u,addr:h.a});S.activeTab=S.tabs.length-1;S.sftp=true;go('terminal')}break;}
  case 'toggleSftp':S.sftp=!S.sftp;render();break;
  case 'tab':S.activeTab=+val;S.section='terminal';S.nav='hosts';render();break;
  case 'closeTab':S.tabs.splice(+val,1);if(S.activeTab>=S.tabs.length)S.activeTab=Math.max(0,S.tabs.length-1);if(!S.tabs.length)go('hosts');else render();break;
  case 'newTab':go('hosts');notify('选择一个主机开始连接');break;
  case 'sftpPane':S.sftpLocal=!S.sftpLocal;S.fileSel=new Set();notify(S.sftpLocal?'显示本机文件':'显示服务器文件');render();break;
  case 'fileClick':{const i=+val;S.fileSel.has(i)?S.fileSel.delete(i):S.fileSel.add(i);render();break;}
  case 'fileProps':S.detail=val;S.modal='properties';S.menu=null;render();break;
  case 'sftpUpload':notify('调用 Windows 原生文件对话框（app.OpenFiles）');S.menu=null;render();break;
  case 'sftpUploadDir':notify('调用 Windows 原生目录对话框（app.OpenDirectory）');S.menu=null;render();break;
  case 'doNewFile':{const n=S.form.fname||'新建';FILES.push({n:n,d:val==='dir',s:val==='dir'?'—':'0 B',m:'2026-11-11 13:52'});S.modal=null;notify('已创建 '+n);render();break;}
  case 'fileUp':notify('上级目录');break;
  case 'crumb':notify('跳转到该目录');break;
  case 'refresh':notify('已刷新');break;
  case 'importMenu':S.importOpen=!S.importOpen;S.keyMenu=false;render();break;
  case 'keyMenu':S.keyMenu=!S.keyMenu;S.importOpen=false;render();break;
  case 'copyPub':notify('已复制公钥到剪贴板');break;
  case 'savePass':notify('口令已加密保存');break;
  case 'retrust':notify('已重新信任选中项');break;
  case 'sendSnippet':notify('命令已发送到终端');break;
  case 'tableRow':{const p=val.split('|');S.tableSel[p[0]]=+p[1];render();break;}
  case 'toggleRow':notify('已切换启动 / 停止');break;
  case 'removeRow':notify('已移除选中行');break;
  case 'setcat':S.setcat=val;render();break;
  case 'setSeg':{const p=val.split('|');S.settings[p[0]]=p[1];render();break;}
  case 'sw':S.settings[val]=!S.settings[val];render();break;
  case 'noteSel':S.notesSel=val;render();break;
  case 'newNote':notify('已新建笔记');break;
  case 'workspaceToggle':S.workspaceOpen=S.workspaceOpen===+val?null:+val;render();break;
  case 'openWorkspace':S.tabs.push({name:'工作区 · 日常运维',user:'dby',addr:'localhost'});S.activeTab=S.tabs.length-1;go('terminal');break;
  case 'closePalette':S.cmdOpen=false;render();break;
  case 'paletteGo':{S.cmdOpen=false;if(val.startsWith('cmd:')){const c=val.slice(4);if(c==='newHost'){S.form={};S.modal='newHost';render()}else if(c==='localTerminal')handle('localTerminal');else{S.sftp=true;go('terminal')}}else go(val);break;}
 }
}
document.addEventListener('click',e=>{
 const stop=e.target.closest('[data-stop]');
 if(!stop&&S.menu){S.menu=null;render()}
 if(!stop&&(S.importOpen||S.keyMenu)){S.importOpen=false;S.keyMenu=false;render()}
 const el=e.target.closest('[data-act]');
 if(!el)return;
 const act=el.dataset.act,val=el.dataset.val;
 if((act==='overlayClose'||act==='closePalette')&&stop)return;
 handle(act,val,el,e);
});
document.addEventListener('dblclick',e=>{
 const row=e.target.closest('[data-act="hostClick"]');
 if(row){const h=HOSTS.find(x=>x.id===+row.dataset.val);if(h)openHost(h,true)}
});
document.addEventListener('contextmenu',e=>{
 e.preventDefault();
 const host=e.target.closest('[data-ctx="host"]'),grp=e.target.closest('[data-ctx="group"]'),f=e.target.closest('[data-ctx="sftp"]'),blank=e.target.closest('[data-ctx="sftpBlank"]');
 if(host)hostMenu(e.clientX,e.clientY,+host.dataset.val);
 else if(grp)groupMenu(e.clientX,e.clientY,grp.dataset.val);
 else if(f)sftpMenu(e.clientX,e.clientY,+f.dataset.val);
 else if(blank)sftpMenu(e.clientX,e.clientY,null);
 else{S.menu=null;render()}
});
document.addEventListener('input',e=>{
 const m=e.target.dataset.model;if(!m)return;
 if(m.startsWith('form.')){S.form[m.slice(5)]=e.target.value;return}
 if(m==='query'){S.query=e.target.value;render()}
 if(m==='palette'){S.paletteQuery=e.target.value;render()}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.cmdOpen=!S.cmdOpen;S.paletteQuery='';render();return}
 if(e.key==='Escape'){if(S.cmdOpen)S.cmdOpen=false;else if(S.modal)S.modal=null;else if(S.menu)S.menu=null;else if(S.importOpen||S.keyMenu){S.importOpen=false;S.keyMenu=false}else return;render()}
});
render();
</script>
</body>
</html>
